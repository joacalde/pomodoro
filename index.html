<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1435">
<title>Pomodoro</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pomodoro">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Oswald:wght@700&family=Fredoka:wght@600&family=JetBrains+Mono:wght@800&family=DM+Serif+Display&family=Outfit:wght@200&display=swap" rel="stylesheet">
<style>
@property --accent { syntax:'<color>'; inherits:true; initial-value:#FF5A3C; }

:root{
  --bg:#E9EBF8; --ink:#141A3F;
  --c-focus:#FF5A3C; --c-short:#27C19A; --c-long:#7C88FF;
  --on-focus:#10131F; --on-short:#10131F; --on-long:#10131F;
  --muted:color-mix(in oklab, var(--ink) 58%, var(--bg));
  --soft:color-mix(in oklab, var(--bg) 80%, transparent);
  --line:color-mix(in oklab, var(--ink) 16%, transparent);
  --la:.85; --p:0; --lvl:0; --fs:200px; --dw:.5em; --cw:.22em;
  --clock-font:"Big Shoulders Display","Oswald",Impact,sans-serif; --clock-w:900;
  --text:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0F1435; --ink:#F3F2FF; } }
:root[data-theme="dark"]{ --bg:#0F1435; --ink:#F3F2FF; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:border-box; }
html,body{ height:100%; margin:0; overflow:hidden; }
body{
  background:var(--bg); color:var(--ink); font-family:var(--text);
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  transition:--accent .8s ease;
}
body[data-mode="focus"]{ --accent:var(--c-focus); --on-accent:var(--on-focus); }
body[data-mode="short"]{ --accent:var(--c-short); --on-accent:var(--on-short); }
body[data-mode="long"] { --accent:var(--c-long);  --on-accent:var(--on-long); }
button,input{ font:inherit; color:inherit; }
button{ cursor:pointer; }
[hidden]{ display:none !important; }
:focus-visible{ outline:3px solid var(--accent); outline-offset:3px; }
.sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }

/* ============ Fondo y tanque ============ */
.base{ position:fixed; inset:0; z-index:0; background:var(--bg); }
body.glow .base{
  background:
    radial-gradient(90% 80% at 8% 0%, color-mix(in oklab, var(--accent) 20%, transparent), transparent 62%),
    radial-gradient(70% 60% at 100% 100%, color-mix(in oklab, var(--accent) 10%, transparent), transparent 60%),
    var(--bg);
}
#stars{ position:fixed; inset:0; width:100%; height:100%; z-index:1; pointer-events:none; }
.sweep{ position:fixed; inset:0; z-index:1; pointer-events:none; }
.tank{ position:fixed; inset:0; z-index:2; opacity:var(--la); pointer-events:none; }
.fill{ position:absolute; inset:0; background:var(--accent); clip-path:inset(calc((1 - var(--p)) * 100%) 0 0 0); }
.waves{
  position:absolute; left:0; width:100%; height:26px; bottom:calc(var(--p) * 100%); margin-bottom:-1px;
  transform:scaleY(calc(1 + var(--lvl) * 1.7)); transform-origin:50% 100%;
}
.wwrap{ position:absolute; inset:0; transform-origin:50% 100%; }
.wwrap.splash{ animation:splash 1.5s cubic-bezier(.3,.6,.3,1); }
@keyframes splash{ 0%{transform:scaleY(1)} 20%{transform:scaleY(2.8)} 45%{transform:scaleY(.7)} 70%{transform:scaleY(1.4)} 100%{transform:scaleY(1)} }
.wave{ position:absolute; left:0; bottom:0; width:200%; height:100%; animation:slide 7s linear infinite; }
.wave path{ fill:var(--accent); }
.wave.back{ opacity:.45; height:82%; animation-duration:11s; animation-direction:reverse; }
@keyframes slide{ to{ transform:translateX(-50%); } }
.bubbles span{
  position:absolute; bottom:-24px; border-radius:50%; background:rgba(255,255,255,.4); opacity:0;
  animation:rise var(--dur) linear var(--delay) infinite; animation-play-state:paused;
}
.running .bubbles span{ animation-play-state:running; }
@keyframes rise{ 0%{transform:translate(0,0);opacity:0} 12%{opacity:.9} 100%{transform:translate(var(--dx),-104vh);opacity:0} }
.bar{ position:fixed; left:0; bottom:0; height:6px; width:calc(var(--p) * 100%); background:var(--accent); z-index:2; display:none; }
body.no-liquid .tank{ display:none; }
body.no-liquid .bar{ display:block; }
body.no-bubbles .bubbles{ display:none; }

/* ============ Reloj ============ */
.clock-layer{ position:fixed; inset:0; z-index:3; pointer-events:none; }
.clock{
  position:absolute; display:flex; white-space:nowrap; user-select:none;
  font-family:var(--clock-font); font-weight:var(--clock-w); font-size:var(--fs); line-height:1;
  color:var(--ink);
  left:calc(max(18px, env(safe-area-inset-left,0px)) + 2vw); top:52%; transform:translateY(-50%);
  text-shadow:0 .02em .12em color-mix(in oklab, var(--bg) 45%, transparent);
  font-variant-numeric:tabular-nums;
}
.clock .d, .clock .c{ position:relative; display:inline-block; text-align:center; }
.clock .d{ width:var(--dw); }
.clock .c{ width:var(--cw); }
.clock .g{ display:block; }
.clock .g.in{ animation:gin .42s cubic-bezier(.2,.9,.3,1.2); }
.clock .g.out{ position:absolute; inset:0; animation:gout .38s ease-in forwards; }
@keyframes gin{ from{ transform:translateY(38%); opacity:0; filter:blur(8px); } }
@keyframes gout{ to{ transform:translateY(-38%); opacity:0; filter:blur(8px); } }
.running .clock .c .g{ animation:blink 1s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:.25; } }
.clock.beat{ animation:beat .5s ease-out; }
@keyframes beat{ 0%{ scale:1.06; } 100%{ scale:1; } }

/* ============ UI ============ */
.ui{
  position:fixed; inset:0; z-index:5; pointer-events:none;
  padding:max(12px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px))
          max(12px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px));
}
.ui > *{ pointer-events:auto; }
.glass{
  background:var(--soft); border:1px solid var(--line);
  -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
}
.top{ display:flex; align-items:center; gap:10px; transition:opacity .8s, transform .8s; }
.tabs{ display:flex; gap:2px; padding:4px; border-radius:999px; flex-shrink:0; }
.tabs button{
  border:0; background:transparent; padding:7px 13px; border-radius:999px;
  font-weight:700; font-size:14px; color:var(--muted); transition:background .35s, color .35s;
}
.tabs button[aria-selected="true"]{ background:var(--accent); color:var(--on-accent); }
.task-wrap{ position:relative; flex:1; min-width:0; max-width:340px; margin:0 auto; }
.task{
  width:100%; background:transparent; border:0; border-bottom:2px dashed var(--line);
  padding:6px 2px; font-size:16px; font-weight:700; text-align:center; color:var(--ink);
}
.task::placeholder{ color:var(--muted); font-weight:500; }
.task:focus{ outline:none; border-bottom:2px solid var(--accent); }
.task-chips{
  position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); z-index:10;
  width:max-content; max-width:min(520px, 86vw); padding:8px; border-radius:16px;
  display:none; flex-wrap:wrap; gap:6px; justify-content:center;
}
.task-chips.show{ display:flex; }
.tchip{ display:flex; align-items:center; border-radius:999px; background:var(--bg); border:1px solid var(--line); }
.tchip button{ border:0; background:none; padding:6px 4px 6px 12px; font-weight:600; font-size:14px; }
.tchip button.x{ padding:6px 10px 6px 4px; color:var(--muted); font-size:15px; }
.icons{ display:flex; gap:7px; flex-shrink:0; }
.icon{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; flex-shrink:0; }
.icon svg{ width:20px; height:20px; }

.controls{
  position:absolute; right:max(16px, env(safe-area-inset-right,0px)); top:52%; transform:translateY(-50%);
  display:flex; flex-direction:column; align-items:center; gap:14px; transition:opacity .8s;
}
.ctl{ width:50px; height:50px; border-radius:50%; display:grid; place-items:center; color:var(--ink); transition:transform .15s; }
.ctl svg{ width:22px; height:22px; }
.ctl:active{ transform:scale(.9); }
.play{ width:82px; height:82px; background:var(--ink); color:var(--bg); border:0; }
.play svg{ width:34px; height:34px; }
.running .play{ animation:ring 2.4s ease-out infinite; }
@keyframes ring{
  0%{ box-shadow:0 0 0 0 color-mix(in oklab, var(--accent) 70%, transparent); }
  100%{ box-shadow:0 0 0 24px color-mix(in oklab, var(--accent) 0%, transparent); }
}
.play .i-pause{ display:none; }
.running .play .i-play{ display:none; }
.running .play .i-pause{ display:block; }

.bottom{
  position:absolute; left:max(16px, env(safe-area-inset-left,0px)); right:max(16px, env(safe-area-inset-right,0px));
  bottom:max(12px, env(safe-area-inset-bottom,0px));
  display:flex; align-items:flex-end; justify-content:space-between; gap:12px;
}
.phrase{
  margin:0; max-width:min(62ch, 60vw); padding:9px 14px; border-radius:14px; text-align:left; cursor:pointer;
  font-size:15px; font-weight:600; line-height:1.35; transition:opacity .35s, transform .35s;
}
.phrase small{ display:block; margin-top:3px; font-size:12px; font-weight:600; color:var(--muted); }
.phrase.out{ opacity:0; transform:translateY(8px); }
.progress{
  display:flex; align-items:center; gap:12px; padding:9px 14px; border-radius:14px;
  font-size:14px; font-weight:700; white-space:nowrap; transition:opacity .8s;
}
.dots{ display:flex; gap:6px; }
.dots i{ width:11px; height:11px; border-radius:50%; border:2px solid var(--muted); transition:background .4s, border-color .4s, transform .4s; }
.dots i.on{ background:var(--accent); border-color:var(--accent); transform:scale(1.15); }
.progress.goal #today{ color:var(--accent); }
.rotate-hint{ display:none; }

/* Modo inmersivo */
#catch{ position:fixed; inset:0; z-index:9; display:none; }
body.calm #catch{ display:block; }
body.calm .top, body.calm .controls, body.calm .progress{ opacity:0; pointer-events:none; }
body.calm .top{ transform:translateY(-8px); }
body.calm .phrase{ opacity:.8; }
body.calm{ cursor:none; }

/* Toast */
.toast{
  position:fixed; left:50%; bottom:calc(max(12px, env(safe-area-inset-bottom,0px)) + 64px); z-index:8;
  transform:translate(-50%, 20px); opacity:0; pointer-events:none;
  display:flex; align-items:center; gap:14px; padding:10px 10px 10px 16px; border-radius:14px;
  background:var(--ink); color:var(--bg); font-weight:600; font-size:15px;
  transition:opacity .3s, transform .3s;
}
.toast.show{ opacity:1; transform:translate(-50%,0); pointer-events:auto; }
.toast button{ border:0; border-radius:999px; padding:7px 14px; background:var(--accent); color:var(--on-accent); font-weight:800; }

/* ============ Vertical ============ */
@media (orientation:portrait){
  .top{ flex-wrap:wrap; justify-content:center; }
  .task-wrap{ order:3; flex-basis:100%; max-width:none; }
  .clock{ left:50%; top:38%; transform:translate(-50%,-50%); }
  .controls{ top:auto; bottom:calc(max(12px, env(safe-area-inset-bottom,0px)) + 132px); left:0; right:0; transform:none; flex-direction:row; justify-content:center; gap:22px; }
  .bottom{ flex-direction:column; align-items:stretch; }
  .phrase{ max-width:none; }
  .progress{ justify-content:space-between; }
  .rotate-hint{ display:block; position:absolute; left:0; right:0; top:58%; margin:0; text-align:center; font-size:13px; color:var(--muted); }
  body.running .rotate-hint{ display:none; }
  .toast{ bottom:calc(max(12px, env(safe-area-inset-bottom,0px)) + 230px); }
}
@media (orientation:landscape) and (max-height:420px){
  .tabs button{ padding:6px 10px; font-size:13px; }
  .icon{ width:36px; height:36px; }
  .icon svg{ width:18px; height:18px; }
  .play{ width:70px; height:70px; }
  .ctl:not(.play){ width:44px; height:44px; }
  .controls{ gap:10px; }
  .phrase{ font-size:13px; padding:7px 12px; }
  .progress{ font-size:13px; padding:7px 12px; }
}

/* ============ Capas de arriba ============ */
#fx{ position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:42; }

.overlay{
  position:fixed; inset:0; display:grid; place-items:center; padding:24px;
  background:color-mix(in oklab, var(--bg) 60%, transparent);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  opacity:0; visibility:hidden; transition:opacity .35s, visibility 0s .35s;
}
.overlay.show{ opacity:1; visibility:visible; transition:opacity .35s; }
.card{ text-align:center; max-width:560px; transform:scale(.86); transition:transform .55s cubic-bezier(.2,1.5,.4,1); }
.overlay.show .card{ transform:scale(1); }

#done{ z-index:40; }
#done h2{ margin:0; font-family:var(--clock-font); font-weight:var(--clock-w); line-height:.95; font-size:min(17vh, 11vw); color:var(--accent); text-wrap:balance; }
#done.show h2{ animation:cheer 1.2s cubic-bezier(.2,1.6,.4,1) both; }
#done.show .quote, #done.show .meta{ animation:fadeUp .6s .5s both; }
@keyframes cheer{ 0%{ scale:.4; rotate:-6deg; } 60%{ scale:1.12; rotate:2deg; } 100%{ scale:1; rotate:0deg; } }
@keyframes fadeUp{ from{ opacity:0; transform:translateY(10px); } }
#done .quote{ margin:14px auto 4px; font-size:18px; font-weight:700; line-height:1.35; text-wrap:balance; }
#done .quote small{ display:block; font-size:13px; color:var(--muted); margin-top:4px; }
#done .meta{ margin:8px auto 20px; color:var(--muted); font-weight:600; font-size:15px; }
.actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.btn{ border:0; border-radius:999px; padding:12px 22px; font-weight:800; font-size:16px; background:var(--ink); color:var(--bg); }
.btn.ghost{ background:transparent; color:var(--ink); border:2px solid var(--line); }
.btn.accent{ background:var(--accent); color:var(--on-accent); }

#confirm{ z-index:45; }
#confirm .card{ background:var(--bg); border:1px solid var(--line); border-radius:24px; padding:22px 22px 18px; width:min(420px, 92vw); }
#confirm h2{ margin:0 0 6px; font-size:22px; font-weight:800; }
#confirm p{ margin:0 0 18px; color:var(--muted); font-weight:600; line-height:1.4; }
#confirm .actions{ flex-direction:column; }
#confirm .btn{ width:100%; }

#offer{ z-index:20; background:color-mix(in oklab, var(--bg) 40%, transparent); cursor:pointer; }
#offer .cross{ width:28px; height:40px; margin:0 auto 10px; color:var(--accent); }
#offer h2{ margin:0; font-size:min(7vh, 30px); font-weight:800; line-height:1.2; }
#offer .int{ margin:8px 0 0; font-weight:700; color:var(--accent); }
#offer .jac{ margin:10px 0 0; font-size:16px; font-weight:600; color:var(--muted); }
#offer .jac small{ display:block; font-size:12px; margin-top:2px; }

#eye{ z-index:25; }
#eye .card{ background:var(--bg); border:1px solid var(--line); border-radius:28px; padding:24px 26px 20px; width:min(440px, 92vw); }
#eye .ring{ position:relative; width:120px; height:120px; margin:0 auto 12px; }
#eye .ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
#eye .ring circle{ fill:none; stroke-width:8; }
#eye .ring .trk{ stroke:var(--line); }
#eye .ring .arc{ stroke:var(--accent); stroke-linecap:round; stroke-dasharray:327; stroke-dashoffset:0; }
#eye.show .ring .arc{ animation:eyearc 20s linear forwards; }
@keyframes eyearc{ to{ stroke-dashoffset:327; } }
#eye .ring b{ position:absolute; inset:0; display:grid; place-items:center; font-family:var(--clock-font); font-weight:var(--clock-w); font-size:52px; }
#eye h2{ margin:0 0 6px; font-size:24px; font-weight:800; }
#eye p{ margin:0 0 16px; color:var(--muted); font-weight:600; line-height:1.4; }
.glowburst{
  position:fixed; inset:0; z-index:29; pointer-events:none;
  background:radial-gradient(circle at var(--gx,50%) var(--gy,50%), color-mix(in oklab, var(--accent) 55%, transparent), transparent 55%);
  animation:gb 1.4s ease-out forwards;
}
@keyframes gb{ 0%{ opacity:0; transform:scale(.6); } 25%{ opacity:1; } 100%{ opacity:0; transform:scale(1.6); } }

/* ============ Panel lateral ============ */
.scrim{ position:fixed; inset:0; z-index:49; background:rgba(5,8,30,.45); opacity:0; visibility:hidden; transition:opacity .3s, visibility 0s .3s; }
.sheet{
  position:fixed; top:0; right:0; bottom:0; z-index:50; width:min(440px, 100%);
  background:var(--bg); border-left:1px solid var(--line);
  transform:translateX(102%); transition:transform .42s cubic-bezier(.2,.9,.2,1);
  display:flex; flex-direction:column;
  padding:max(12px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px))
          max(12px, env(safe-area-inset-bottom,0px)) 16px;
}
.sheet-open .scrim{ opacity:1; visibility:visible; transition:opacity .3s; }
.sheet-open .sheet{ transform:none; }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
.seg{ display:flex; padding:4px; border-radius:999px; gap:2px; }
.seg button{ border:0; background:none; padding:8px 16px; border-radius:999px; font-weight:800; color:var(--muted); }
.seg button[aria-selected="true"]{ background:var(--ink); color:var(--bg); }
.sheet-body{ overflow-y:auto; flex:1; padding-right:4px; overscroll-behavior:contain; }
.sec{ margin:18px 0 2px; font-family:var(--clock-font); font-weight:var(--clock-w); font-size:26px; line-height:1.1; color:var(--accent); }
.sec:first-child{ margin-top:4px; }
.row{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:11px 0; border-bottom:1px solid var(--line); }
.blk{ padding:12px 0; border-bottom:1px solid var(--line); }
.lbl{ font-weight:600; font-size:15px; line-height:1.3; }
.blk > .lbl{ display:block; margin-bottom:9px; }
.stepper{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
.stepper button{ width:36px; height:36px; border-radius:50%; border:1px solid var(--line); background:var(--soft); font-size:20px; font-weight:700; line-height:1; user-select:none; touch-action:none; }
.stepper output{ min-width:64px; text-align:center; font-family:var(--clock-font); font-weight:var(--clock-w); font-size:26px; }
.stepper output small{ font-family:var(--text); font-size:12px; font-weight:600; color:var(--muted); margin-left:2px; }
.switch{ width:50px; height:30px; border-radius:999px; border:0; padding:3px; flex-shrink:0; background:var(--line); transition:background .25s; display:flex; }
.switch::after{ content:""; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .25s; }
.switch[aria-checked="true"]{ background:var(--accent); }
.switch[aria-checked="true"]::after{ transform:translateX(20px); }
.chips{ display:flex; flex-wrap:wrap; gap:7px; }
.chip{ padding:8px 13px; border-radius:999px; border:1px solid var(--line); background:var(--soft); font-weight:600; font-size:14px; display:flex; align-items:center; gap:7px; }
.chip[aria-checked="true"]{ background:var(--accent); color:var(--on-accent); border-color:transparent; }
.sw{ display:flex; }
.sw i{ width:12px; height:12px; border-radius:50%; margin-left:-3px; border:2px solid var(--bg); }
.sw i:first-child{ margin-left:0; }
input[type="range"]{ width:100%; accent-color:var(--accent); }
.range-row{ display:flex; align-items:center; gap:12px; }
.range-row output{ min-width:44px; text-align:right; font-weight:700; }
.colors{ display:flex; gap:14px; flex-wrap:wrap; }
.colors label{ display:flex; flex-direction:column; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--muted); }
.colors input{ width:48px; height:48px; border:2px solid var(--line); border-radius:50%; padding:0; background:none; cursor:pointer; overflow:hidden; }
.colors input::-webkit-color-swatch-wrapper{ padding:0; }
.colors input::-webkit-color-swatch{ border:0; border-radius:50%; }
.colors input::-moz-color-swatch{ border:0; border-radius:50%; }
.txt{ width:100%; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--soft); font-size:15px; }
.txt:focus{ outline:none; border-color:var(--accent); }
.hint{ margin:6px 0 0; font-size:13px; color:var(--muted); line-height:1.4; }
.preview{ margin-top:10px; display:flex; align-items:center; gap:10px; font-size:14px; font-weight:600; }
.preview button{ border:0; border-radius:999px; padding:6px 12px; background:var(--ink); color:var(--bg); font-weight:700; }
.link{ background:none; border:0; color:var(--muted); font-weight:600; text-decoration:underline; padding:6px 0; margin-right:14px; }
.danger{ color:#E5484D; }

/* Progreso */
.stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:6px; }
.stat{ padding:12px 14px; border-radius:16px; border:1px solid var(--line); background:var(--soft); }
.stat b{ display:block; font-family:var(--clock-font); font-weight:var(--clock-w); font-size:32px; line-height:1; }
.stat span{ font-size:13px; color:var(--muted); font-weight:600; }
.week{ display:flex; align-items:flex-end; gap:8px; height:130px; padding-top:8px; }
.week .col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
.week .b{ width:100%; border-radius:8px 8px 4px 4px; background:color-mix(in oklab, var(--ink) 22%, transparent); min-height:4px; transition:height .6s cubic-bezier(.2,.9,.3,1); }
.week .col.today .b{ background:var(--accent); }
.week .v{ font-size:11px; color:var(--muted); font-weight:700; min-height:14px; }
.week .dl{ font-size:12px; font-weight:700; color:var(--muted); }
.trow{ padding:8px 0; }
.trow .tl{ display:flex; justify-content:space-between; font-size:14px; font-weight:700; margin-bottom:5px; gap:10px; }
.trow .tl span:last-child{ color:var(--muted); font-weight:600; white-space:nowrap; }
.trow .tb{ height:8px; border-radius:99px; background:var(--line); overflow:hidden; }
.trow .tb i{ display:block; height:100%; background:var(--accent); border-radius:99px; }
.empty{ color:var(--muted); font-size:14px; }

@media (display-mode: fullscreen), (display-mode: standalone){ #fsBtn{ display:none; } }
@media (prefers-reduced-motion: reduce){
  .wave, .bubbles span, .running .play, .running .clock .c .g, .wwrap.splash, .clock.beat, .clock .g.in, .clock .g.out{ animation:none !important; }
  .clock .g.out{ display:none; }
  .bubbles{ display:none; }
}

function el(tag, attrs, ...kids){
  const e = document.createElement(tag);

    else if(k === "text") e.textContent = attrs[k];

const KEY = "pomo.v2";
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

function freshData(){
  return { v:2, updatedAt:0, settings:JSON.parse(JSON.stringify(DEF)), days:{}, totals:{n:0,m:0},
           cycle:0, cycleDay:dayKey(), tasks:[], task:"", timer:null, bags:{} };
}
function normalize(d){
  const base = freshData();
  if(!d || typeof d !== "object") return base;
  const out = Object.assign(base, d);
  out.settings = Object.assign(JSON.parse(JSON.stringify(DEF)), d.settings || {});
  out.settings.custom = Object.assign({}, DEF.custom, (d.settings && d.settings.custom) || {});
  if(!THEMES[out.settings.theme]) out.settings.theme = "tomate";
  if(!FONTS[out.settings.font]) out.settings.font = "condensada";
  out.days = (d.days && typeof d.days === "object") ? d.days : {};
  out.totals = Object.assign({n:0, m:0}, d.totals || {});
  out.tasks = Array.isArray(d.tasks) ? d.tasks.filter(t => typeof t === "string").slice(0,10) : [];
  out.bags = (d.bags && typeof d.bags === "object") ? d.bags : {};
  return out;
}
function loadData(){
  let d = store.get(KEY, null);
  if(!d){
    d = freshData();
    const s1 = store.get("pomo.settings", null), st1 = store.get("pomo.stats", null), t1 = store.get("pomo.task", "");
    if(s1) ["focus","short","long","cycles","goal","auto","vibe","wake"].forEach(k => { if(s1[k] !== undefined) d.settings[k] = s1[k]; });
    if(st1 && st1.count){
      const parts = String(st1.day || "").split("-");
      const k = parts.length === 3 ? parts[0]+"-"+pad2(parts[1])+"-"+pad2(parts[2]) : dayKey();
      const m = st1.count * (d.settings.focus || 25);
      d.days[k] = {n:st1.count, m, t:{}};
      d.totals = {n:st1.count, m};
      if(k === dayKey()) d.cycle = st1.cycle || 0;
    }
    if(t1) d.task = t1;

}

   ===================================================================== */
function listFor(kind){
  if(kind === "offer") return BANK.offerF;
  const src = S.phrases;
  if(src === "faith") return BANK[kind+"F"];
  if(src === "general") return BANK[kind+"G"];
  return BANK[kind+"G"].concat(BANK[kind+"F"]);
}
function draw(kind){
  const list = listFor(kind);
  const key = kind + ":" + (kind === "offer" ? "f" : S.phrases);
  let bag = D.bags[key];
  if(!bag || bag.n !== list.length || !Array.isArray(bag.o) || bag.i >= bag.o.length){
    const last = bag && bag.o ? bag.o[bag.o.length-1] : -1;
    const o = list.map((_,i) => i);
    for(let i = o.length-1; i > 0; i--){ const j = Math.floor(rnd()*(i+1)); [o[i],o[j]] = [o[j],o[i]]; }
    if(o.length > 1 && o[0] === last){ [o[0],o[1]] = [o[1],o[0]]; }
    bag = {n:list.length, o, i:0};
  }
  const item = list[bag.o[bag.i++]] || list[0];
  D.bags[key] = bag;
  const [t, a] = item.split("|");
  return {t, a:a || ""};
}
function fillQuote(node, q){
  node.textContent = q.t;
  if(q.a) node.append(el("small", {text:q.a}));
}
function newPhrase(){

  setTimeout(() => { fillQuote(p, q); p.classList.remove("out"); }, RM ? 0 : 320);
  save();
}

  const h = hex.replace("#",""); const n = parseInt(h.length === 3 ? h.split("").map(c=>c+c).join("") : h, 16);
  const c = [n>>16 & 255, n>>8 & 255, n & 255].map(v => { v/=255; return v <= .03928 ? v/12.92 : Math.pow((v+.055)/1.055, 2.4); });
  return .2126*c[0] + .7152*c[1] + .0722*c[2];
}

/* Mide el ancho real de los dígitos con la fuente que cargó, para que nunca se pisen */
const mctx = document.createElement("canvas").getContext("2d");
let DW = .5, CW = .22;
function measureDigits(){
  const F = FONTS[S.font] || FONTS.condensada;
  try{
    mctx.font = F.w + " 100px " + F.f;
    let mx = 0; for(let d = 0; d < 10; d++) mx = Math.max(mx, mctx.measureText(String(d)).width);
    const col = mctx.measureText(":").width;
    DW = mx > 0 ? mx/100 + .015 : F.dw;
    CW = col > 0 ? Math.max(.16, col/100 + .03) : F.cw;
  }catch(e){ DW = F.dw; CW = F.cw; }
  root.style.setProperty("--dw", DW.toFixed(3)+"em");
  root.style.setProperty("--cw", CW.toFixed(3)+"em");
  fitClock();
}
function applyFont(){
  const F = FONTS[S.font] || FONTS.condensada;
  root.style.setProperty("--clock-font", F.f);
  root.style.setProperty("--clock-w", F.w);
  measureDigits();
  if(document.fonts && document.fonts.load){
    const fam = F.f.split(",")[0];
    document.fonts.load(F.w + " 100px " + fam, "0123456789:").then(measureDigits).catch(()=>{});
  }
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(measureDigits).catch(()=>{});
function fitClock(){
  const F = FONTS[S.font] || FONTS.condensada;
  const str = lastStr || "25:00";
  const nd = str.replace(":","").length;
  const emW = nd*DW + CW;
  const W = window.innerWidth, H = window.innerHeight;
  let bw, bh;
  if(W > H){ bw = W - (W < 700 ? 118 : 150) - 44; bh = H*.58; }
  else { bw = W*.9; bh = H*.24; }
  const fs = Math.max(40, Math.min(bw/emW, bh/F.ch));
  root.style.setProperty("--fs", fs.toFixed(1)+"px");
}
window.addEventListener("resize", () => { fitClock(); if(S.stars) initStars(); });

/* =====================================================================
   RELOJ CON DÍGITOS ANIMADOS
   ===================================================================== */
const clockEl = $("#clock");
let slots = [];
function fmt(ms){
  const secs = Math.ceil(ms/1000), m = Math.floor(secs/60), s = secs % 60;
  return pad2(m) + ":" + pad2(s);
}
function buildClock(str){
  clockEl.innerHTML = ""; slots = [];
  for(const ch of str){
    const s = el("span", {class: ch === ":" ? "c" : "d"});
    const g = el("span", {class:"g", text:ch});
    s.append(g); clockEl.append(s);
    slots.push({el:s, ch, g});
  }
}
function setClock(str, animate){
  if(slots.length !== str.length){ lastStr = str; buildClock(str); fitClock(); return; }
  for(let i = 0; i < str.length; i++){
    const ch = str[i], sl = slots[i];
    if(sl.ch === ch) continue;
    sl.ch = ch;
    if(!animate || RM){ sl.g.textContent = ch; continue; }
    const old = sl.g;
    old.classList.remove("in"); old.classList.add("out");
    setTimeout(() => old.remove(), 420);
    const g = el("span", {class:"g in", text:ch});
    sl.el.append(g); sl.g = g;
  }
}
function render(){
  const str = fmt(remaining);
  if(str !== lastStr){
    setClock(str, true);
    lastStr = str;
    document.title = str + " · " + LABEL[mode];
    const sec = Math.ceil(remaining/1000);
    if(running && sec <= 10 && sec > 0 && sec !== lastSec){
      clockEl.classList.remove("beat"); void clockEl.offsetWidth; clockEl.classList.add("beat");
      if(S.tick) tickSound();
    }
    lastSec = sec;
  }
  const p = total > 0 ? Math.min(1, Math.max(0, 1 - remaining/total)) : 0;
  root.style.setProperty("--p", p.toFixed(4));
}
function renderMeta(){
  document.body.dataset.mode = mode;
  document.body.classList.toggle("running", running);
  $$(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.mode === mode)));
  $("#playBtn").setAttribute("aria-label", running ? "Pausar" : (fresh ? "Empezar" : "Seguir"));
  const filled = mode === "long" ? S.cycles : D.cycle % S.cycles;
  $("#dots").innerHTML = Array.from({length:S.cycles}, (_,i) => '<i class="'+(i < filled ? "on" : "")+'"></i>').join("");
  const d = D.days[dayKey()] || {n:0};
  const met = d.n >= S.goal;
  $("#today").textContent = met ? "Meta cumplida: " + d.n + " hoy" : "Hoy " + d.n + " de " + S.goal;
  $("#progress").classList.toggle("goal", met);
}
function loop(){
  if(!running) return;
  remaining = Math.max(0, endAt - now());
  render();
  if(remaining <= 0){ finish(); return; }
  checkEye();
  raf = requestAnimationFrame(loop);
}

/* =====================================================================
   AUDIO: música generada en vivo, sin letra
   ===================================================================== */
const A = { ac:null, master:null, music:null, rev:null, analyser:null, cur:null, curId:"none", el:null };
const mf = m => 440*Math.pow(2, (m-69)/12);
const volGain = () => Math.pow(S.volume/100, 1.6) * .95;
function audio(){
  if(!A.ac){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      A.ac = new AC();
      const ac = A.ac;
      A.master = ac.createGain(); A.master.gain.value = 1;
      const comp = ac.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = .01; comp.release.value = .25;
      A.master.connect(comp); comp.connect(ac.destination);
      A.music = ac.createGain(); A.music.gain.value = volGain(); A.music.connect(A.master);
      A.analyser = ac.createAnalyser(); A.analyser.fftSize = 512; A.music.connect(A.analyser);
      A.rev = ac.createConvolver(); A.rev.buffer = impulse(ac, 2.8, 2.4);
      const rg = ac.createGain(); rg.gain.value = .55; A.rev.connect(rg); rg.connect(A.music);
    }catch(e){ A.ac = null; }
  }
  if(A.ac && A.ac.state === "suspended") A.ac.resume().catch(()=>{});
  return A.ac;
}
function impulse(ac, secs, decay){
  const len = Math.floor(ac.sampleRate*secs), b = ac.createBuffer(2, len, ac.sampleRate);
  for(let c = 0; c < 2; c++){ const d = b.getChannelData(c); for(let i = 0; i < len; i++) d[i] = (rnd()*2-1)*Math.pow(1-i/len, decay); }
  return b;
}
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function silentWav(){
  const n = 2000, buf = new ArrayBuffer(44+n*2), v = new DataView(buf);
  const w = (o,s) => { for(let i = 0; i < s.length; i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4,36+n*2,true); w(8,"WAVE"); w(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true);
  v.setUint16(22,1,true); v.setUint32(24,8000,true); v.setUint32(28,16000,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,"data"); v.setUint32(40,n*2,true);
  const b = new Uint8Array(buf); let s = ""; for(let i = 0; i < b.length; i++) s += String.fromCharCode(b[i]);
  return "data:audio/wav;base64," + btoa(s);
}
function unlockIOS(){
  if(!isIOS) return;
  try{ if(!A.el){ A.el = new Audio(silentWav()); A.el.loop = true; } A.el.play().catch(()=>{}); }catch(e){}
}
const NBUF = {};
function NB(type){
  if(NBUF[type]) return NBUF[type];
  const ac = A.ac, sr = ac.sampleRate, len = sr*(type === "white" ? 2 : 8);
  const b = ac.createBuffer(1, len, sr), d = b.getChannelData(0);
  if(type === "white"){ for(let i = 0; i < len; i++) d[i] = rnd()*2-1; }
  else if(type === "pink"){
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i = 0; i < len; i++){ const w = rnd()*2-1;
      b0=.99886*b0+w*.0555179; b1=.99332*b1+w*.0750759; b2=.969*b2+w*.153852; b3=.8665*b3+w*.3104856;
      b4=.55*b4+w*.5329522; b5=-.7616*b5-w*.016898; d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11; b6=w*.115926; }
  }
  else if(type === "brown"){ let l = 0; for(let i = 0; i < len; i++){ const w = rnd()*2-1; l = (l + .02*w)/1.02; d[i] = l*3.5; } }
  else if(type === "crackle"){ for(let i = 0; i < len; i++) d[i] = (rnd() < .0003 ? (rnd()*2-1)*.8 : 0) + (rnd()*2-1)*.004; }
  if(type !== "white"){ const f = Math.floor(sr*.03); for(let i = 0; i < f; i++){ const k = i/f; d[i] *= k; d[len-1-i] *= k; } }
  NBUF[type] = b; return b;
}
function G(v = 0){ const g = A.ac.createGain(); g.gain.value = v; return g; }
function O(type, f, t){ const o = A.ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); return o; }
function F(type, f, q){ const b = A.ac.createBiquadFilter(); b.type = type; b.frequency.value = f; if(q) b.Q.value = q; return b; }

function loopNoise(e, type, gain, filters){
  const s = A.ac.createBufferSource(); s.buffer = NB(type); s.loop = true;
  let node = s; (filters || []).forEach(([t,f,q]) => { const bf = F(t,f,q); node.connect(bf); node = bf; });
  const g = G(gain); node.connect(g); g.connect(e.out); s.start(); e.nodes.push(s); return g;
}
function noiseHit(e, t, o){
  const {type="bandpass", freq=1800, q=.8, v=.4, dur=.18, send=0} = o;
  const s = A.ac.createBufferSource(); s.buffer = NB("white");
  const f = F(type, freq, q), g = G(0);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
  s.connect(f); f.connect(g); g.connect(e.out);
  if(send){ const sg = G(send); g.connect(sg); sg.connect(e.send); }
  s.start(t, rnd()*1.5); s.stop(t+dur+.03);
}
function kick(e, t, v = 1){
  const o = O("sine", 140, t), g = G(0);
  o.frequency.exponentialRampToValueAtTime(42, t+.13);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.85*v, t+.005); g.gain.exponentialRampToValueAtTime(.001, t+.42);
  o.connect(g); g.connect(e.out); o.start(t); o.stop(t+.45);

function snare(e, t, v = 1){

function hat(e, t, v = 1, open = false){ noiseHit(e, t, {type:"highpass", freq:7500, q:.5, v:.1*v, dur:open ? .26 : .045}); }
function clap(e, t, v = 1){

function clearTimers(){ clearTimeout(finishTimer); cancelAnimationFrame(raf); }
function runLoop(){

}
function start(){

  running = true; fresh = false;
  endAt = now() + remaining;
  runLoop(); wakeOn(); syncMusic(); renderMeta(); splash(); poke();
  if(wasFresh && mode === "focus" && S.offer && S.phrases !== "general") showOffer();
  persistTimer();
}
function pause(){
  if(!running) return;

  persistTimer();
}
function resetBlock(){

  wakeOff(); syncMusic(); renderMeta(); render(); poke();
}
function changeMode(m, originEl){
  const changed = m !== mode;
  mode = m;
  resetBlock();

}
function checkFinish(){ if(running && now() >= endAt){ remaining = 0; render(); finish(); } }
function nextBreak(){ return D.cycle % S.cycles === 0 ? "long" : "short"; }
function finish(opts = {}){
  running = false; clearTimers(); wakeOff();
  checkDay();
  const was = mode, blockMin = Math.max(1, Math.round(total/60000));
  let next, title, q, meta, go, big = false;
  if(was === "focus"){
    const k = dayKey(), d = D.days[k] || (D.days[k] = {n:0, m:0, t:{}});
    d.n++; d.m += blockMin;
    const tk = (D.task || "").trim() || "Sin nombre";
    d.t = d.t || {}; d.t[tk] = (d.t[tk] || 0) + blockMin;
    D.totals.n++; D.totals.m += blockMin;
    D.cycle++;
    next = nextBreak();
    big = d.n === S.goal;
    title = big ? "¡Meta del día!" : "Pomodoro hecho";
    q = draw("doneFocus");
    meta = "Llevás " + d.n + (d.n === 1 ? " pomodoro" : " pomodoros") + " hoy. Sigue " + (next === "long" ? "una pausa larga" : "una pausa") + " de " + S[next] + " minutos.";
    go = "Empezar la pausa";
    const keys = Object.keys(D.days).sort(); if(keys.length > 400) keys.slice(0, keys.length-400).forEach(x => delete D.days[x]);
  }else{
    if(was === "long") D.cycle = 0;
    next = "focus";
    title = "Se terminó la pausa";
    q = draw("doneBreak");
    meta = "Sigue un enfoque de " + S.focus + " minutos.";
    go = "Empezar el enfoque";
  }
  if(opts.away){ title = was === "focus" ? "Terminaste un pomodoro" : "La pausa terminó"; meta = "Pasó mientras no estabas. " + meta; }
  if(!opts.away){
    chime(was === "focus");
    if(S.vibe && navigator.vibrate){ try{ navigator.vibrate(big ? [200,80,200,80,200,80,400] : [180,90,180,90,320]); }catch(e){} }
    glowBurst(); confetti(big);
  }
  $("#live").textContent = title + ". " + q.t;
  changeMode(next);
  showDone(title, q, meta, go);
  if(S.auto && !opts.away){
    let left = 12;
    const tick = () => {
      if(running || mode !== next || !$("#done").classList.contains("show")) return;
      if(left <= 0){ hideDone(); start(); return; }
      $("#doneGo").textContent = go + " (" + left-- + ")";

    };
    tick();
  }
}
function skipBlock(){

}
function snapshot(){ return {mode, running, endAt, remaining: running ? Math.max(0, endAt-now()) : remaining, total, fresh, cycle:D.cycle, eyeDone}; }
function restoreSnap(sn){

  mode = sn.mode; total = sn.total; fresh = sn.fresh; D.cycle = sn.cycle; eyeDone = sn.eyeDone || 0;
  if(sn.running){
    endAt = sn.endAt; remaining = Math.max(0, endAt - now()); running = true;
    if(remaining <= 0){ finish(); return; }

function elapsedText(){

}

    $("#cfGo").onclick = () => done(true);

async function guard(kind, target){
  if(!S.confirm) return true;
  if(kind === "pause"){ if(!running) return true; }
  else if(!hasProgress()) return true;
  const e = elapsedText(), what = mode === "focus" ? "de enfoque" : "de pausa";
  if(kind === "pause") return ask("¿Seguro que querés pausar?", "Llevás " + e + " " + what + ". Si pausás, el progreso queda guardado.", "Sí, pausar", "No, seguir");
  if(kind === "reset") return ask("¿Reiniciar el bloque?", "Se pierden los " + e + " " + what + " que llevás.", "Sí, reiniciar", "No, seguir");
  if(kind === "skip") return ask("¿Saltar este bloque?", mode === "focus" ? "Llevás " + e + " y este pomodoro no se va a contar." : "Llevás " + e + " de pausa.", "Sí, saltar", "No, seguir");

}

    let tt = null;
    inp.addEventListener("input", () => { S[k] = inp.value; clearTimeout(tt); tt = setTimeout(() => changed(k), 500); });
    updaters.push(() => { if(document.activeElement !== inp) inp.value = S[k] || ""; });
    return el("div", {class:"blk"}, el("span", {class:"lbl", text:it.label}), inp, it.hint ? el("p", {class:"hint", text:it.hint}) : null);
  }
  return el("div");
}
function changed(k){
  if(["focus","short","long"].includes(k) && k === mode && fresh && !running){ total = remaining = dur(mode); render(); }
  if(k === "cycles" || k === "goal") renderMeta();
  if(["theme","scheme","useCustom","custom","la","glow","liquid","bubbles","stars"].includes(k)) applyTheme();
  if(k === "font") applyFont();
  if(k === "volume"){ audio(); setVolume(); }
  if(k === "focusSound" || k === "breakSound") syncMusic();
  if(k === "wake") (S.wake && running) ? wakeOn() : wakeOff();
  if(k === "phrases") newPhrase();
  if(k === "immersive") poke();
  if(k === "useCustom") updaters.forEach(u => u());
  save();
}
function previewSound(id){
  if(id && (running && ((mode === "focus" && S.focusSound === id) || (mode !== "focus" && S.breakSound === id)))){ previewId = null; syncMusic(); return; }
  previewId = (id && id !== "none") ? id : null;
  audio(); unlockIOS(); syncMusic();
  const line = $("#previewLine");
  if(line){ line.hidden = !previewId; $("#previewText").textContent = previewId ? "Probando: " + SOUND_NAME[previewId] : ""; }
}

/* =====================================================================
   PANEL: PROGRESO
   ===================================================================== */
function fmtMin(m){
  m = Math.round(m);
  if(m < 60) return m + " min";
  const h = Math.floor(m/60), r = m % 60;
  return h + " h" + (r ? " " + r + " min" : "");
}
function streak(){
  let k = 0; const d = new Date();
  if(!(D.days[dayKey(d)] && D.days[dayKey(d)].n)) d.setDate(d.getDate()-1);
  while(D.days[dayKey(d)] && D.days[dayKey(d)].n > 0){ k++; d.setDate(d.getDate()-1); }
  return k;
}
function renderStats(){
  const pane = $("#paneStats"); pane.innerHTML = "";
  const td = D.days[dayKey()] || {n:0, m:0, t:{}};
  const st = streak();
  const grid = el("div", {class:"stat-grid"},
    el("div", {class:"stat"}, el("b", {text:String(td.n)}), el("span", {text:"pomodoros hoy (meta: " + S.goal + ")"})),
    el("div", {class:"stat"}, el("b", {text:fmtMin(td.m)}), el("span", {text:"de foco hoy"})),
    el("div", {class:"stat"}, el("b", {text:String(st)}), el("span", {text: st === 1 ? "día seguido" : "días seguidos"})),
    el("div", {class:"stat"}, el("b", {text:fmtMin(D.totals.m)}), el("span", {text:D.totals.n + (D.totals.n === 1 ? " pomodoro en total" : " pomodoros en total")}))
  );
  pane.append(el("h3", {class:"sec", text:"Hoy"}), grid);
  pane.append(el("h3", {class:"sec", text:"Últimos 7 días"}));
  const week = el("div", {class:"week"}), names = ["D","L","M","M","J","V","S"], vals = [];
  for(let i = 6; i >= 0; i--){ const d = new Date(); d.setDate(d.getDate()-i); const x = D.days[dayKey(d)]; vals.push({d, m: x ? x.m : 0, today: i === 0}); }
  const max = Math.max(S.goal*S.focus, ...vals.map(v => v.m), 1);
  vals.forEach(v => {
    const b = el("div", {class:"b"}); b.style.height = "0%";
    week.append(el("div", {class:"col" + (v.today ? " today" : "")}, el("span", {class:"v", text: v.m ? fmtMin(v.m).replace(" min","m") : ""}), b, el("span", {class:"dl", text:names[v.d.getDay()]})));
    requestAnimationFrame(() => requestAnimationFrame(() => { b.style.height = Math.max(3, v.m/max*100) + "%"; }));
  });
  pane.append(week);
  pane.append(el("h3", {class:"sec", text:"Por materia, últimos 30 días"}));
  const agg = {};
  for(let i = 0; i < 30; i++){ const d = new Date(); d.setDate(d.getDate()-i); const x = D.days[dayKey(d)]; if(x && x.t) for(const t in x.t) agg[t] = (agg[t] || 0) + x.t[t]; }
  const rows = Object.entries(agg).sort((a,b) => b[1]-a[1]).slice(0, 8);
  if(!rows.length) pane.append(el("p", {class:"empty", text:"Escribí qué estás estudiando arriba y acá vas a ver cuánto le dedicaste a cada cosa."}));
  const top = rows.length ? rows[0][1] : 1;
  rows.forEach(([t, m]) => {
    const bar = el("i"); bar.style.width = (m/top*100) + "%";
    pane.append(el("div", {class:"trow"}, el("div", {class:"tl"}, el("span", {text:t}), el("span", {text:fmtMin(m)})), el("div", {class:"tb"}, bar)));
  });
}

/* ---- Abrir y cerrar panel ---- */
function openSheet(pane, secId){
  if(pane === "stats") renderStats();
  $$(".seg button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.pane === pane)));
  $("#paneSet").hidden = pane !== "set"; $("#paneStats").hidden = pane !== "stats";
  document.body.classList.add("sheet-open"); document.body.classList.remove("calm");
  $("#sheet").setAttribute("aria-hidden", "false");
  requestAnimationFrame(() => {
    const body = $("#sheetBody");
    if(secId){ const s = document.getElementById(secId); if(s) body.scrollTop = s.offsetTop - 6; } else body.scrollTop = 0;
  });
}
function closeSheet(){
  document.body.classList.remove("sheet-open");
  $("#sheet").setAttribute("aria-hidden", "true");
  if(previewId) previewSound(null);
  poke();
}
$$(".seg button").forEach(b => b.addEventListener("click", () => openSheet(b.dataset.pane)));
$("#setBtn").addEventListener("click", () => openSheet("set"));
$("#musicBtn").addEventListener("click", () => openSheet("set", "sec-music"));
$("#statsBtn").addEventListener("click", () => openSheet("stats"));
$("#closeSheet").addEventListener("click", closeSheet);
$("#scrim").addEventListener("click", closeSheet);

/* =====================================================================
   BOTONES Y TECLADO
   ===================================================================== */
$("#playBtn").addEventListener("click", onPlay);
$("#resetBtn").addEventListener("click", onReset);
$("#skipBtn").addEventListener("click", onSkip);
$$(".tabs button").forEach(b => b.addEventListener("click", () => onTab(b.dataset.mode, b)));
$("#phrase").addEventListener("click", newPhrase);

const fsOK = document.fullscreenEnabled || document.webkitFullscreenEnabled;
if(!fsOK) $("#fsBtn").hidden = true;
$("#fsBtn").addEventListener("click", async () => {
  const d = document.documentElement;
  try{
    if(!(document.fullscreenElement || document.webkitFullscreenElement)){
      await (d.requestFullscreen ? d.requestFullscreen() : d.webkitRequestFullscreen());
      try{ await screen.orientation.lock("landscape"); }catch(e){}
    }else await (document.exitFullscreen ? document.exitFullscreen() : document.webkitExitFullscreen());
  }catch(e){}
});
document.addEventListener("keydown", e => {
  poke();
  if(e.target === taskIn || (e.target.tagName === "INPUT")) return;
  if(dialogOpen) return;
  if(e.key === "Escape"){ if(sheetIsOpen()) closeSheet(); else { hideDone(); hideOffer(); } return; }
  if(sheetIsOpen()) return;
  if(e.code === "Space"){ e.preventDefault(); onPlay(); }
  else if(e.key === "r" || e.key === "R") onReset();
  else if(e.key === "n" || e.key === "N") onSkip();
});
/* El audio arranca con el primer toque si el timer venía corriendo */
document.addEventListener("pointerdown", () => { if(running && !A.ac){ audio(); unlockIOS(); A.curId = "none"; syncMusic(); } }, {capture:true});

document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible"){
    if(running){ wakeOn(); checkFinish(); if(running){ cancelAnimationFrame(raf); raf = requestAnimationFrame(loop); } }
    checkDay(); renderMeta();
    pullCloud();
  }
});

/* =====================================================================
   MEMORIA EN TU CUENTA (si está disponible) + en el dispositivo
   ===================================================================== */
const cloud = {ref:null, writing:false, dirty:false, t:null};
function renderSyncStatus(){
  const s = $("#syncStatus"); if(!s) return;
  s.textContent = cloud.ref
    ? "Tus ajustes, frases e historial se guardan en tu cuenta, así que los vas a encontrar en cualquier dispositivo donde abras esta página."
    : "Tus ajustes, frases e historial se guardan en este dispositivo.";
}
function scheduleSync(){ if(!cloud.ref) return; cloud.dirty = true; clearTimeout(cloud.t); cloud.t = setTimeout(flushSync, 2500); }
async function flushSync(){
  if(!cloud.ref || cloud.writing || !cloud.dirty) return;
  cloud.writing = true; cloud.dirty = false;
  try{ await cloud.ref.set(JSON.parse(JSON.stringify(D))); }
  catch(e){
    const c = e && e.code;
    if(c === "unavailable" || c === "resource_exhausted"){ cloud.dirty = true; setTimeout(flushSync, 5000 + rnd()*3000); }
    else { cloud.ref = null; renderSyncStatus(); }
  }
  cloud.writing = false;
  if(cloud.dirty && cloud.ref){ clearTimeout(cloud.t); cloud.t = setTimeout(flushSync, 1500); }
}
function adopt(r){
  D = normalize(JSON.parse(JSON.stringify(r)));
  S = D.settings;
  store.set(KEY, D);
  applyAll();
  restoreTimer(false);
}
async function initCloud(){
  try{
    if(!window.claude || typeof window.claude.use !== "function") return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    const ref = db.doc("data/users/" + uid + "/pomodoro");
    const snap = await ref.get();
    cloud.ref = ref;
    if(snap.exists){
      const r = snap.data();
      if(r && (r.updatedAt || 0) > (D.updatedAt || 0)) adopt(r);
      else if((D.updatedAt || 0) > ((r && r.updatedAt) || 0)){ cloud.dirty = true; flushSync(); }
    }else if(D.updatedAt){ cloud.dirty = true; flushSync(); }
    renderSyncStatus();
  }catch(e){}
}
async function pullCloud(){
  if(!cloud.ref || cloud.writing || cloud.dirty) return;
  try{ const snap = await cloud.ref.get(); if(snap.exists){ const r = snap.data(); if(r && (r.updatedAt || 0) > (D.updatedAt || 0)) adopt(r); } }catch(e){}
}

/* =====================================================================
   ARRANQUE
   ===================================================================== */
function applyAll(){
  applyTheme(); applyFont(); setVolume();
  taskIn.value = D.task || "";
  buildSettings();
  renderMeta();
  if(sheetIsOpen() && !$("#paneStats").hidden) renderStats();
}
function restoreTimer(first){
  checkDay();
  const T = D.timer;
  clearTimers();
  if(T && LABEL[T.mode]){
    mode = T.mode; total = T.total || dur(mode); fresh = !!T.fresh; eyeDone = T.eyeDone || 0;
    if(T.running){
      endAt = T.endAt; remaining = Math.max(0, endAt - now()); running = true;
      if(remaining <= 0){ render(); finish({away:true}); return; }
      runLoop(); wakeOn();
    }else{
      running = false;
      remaining = fresh ? dur(mode) : Math.min(T.remaining, total);
      if(fresh) total = remaining;
    }
  }else{ mode = "focus"; running = false; fresh = true; total = remaining = dur(mode); }
  renderMeta(); render(); poke();
  if(first || !$("#phrase").textContent) { const q = draw(mode); fillQuote($("#phrase"), q); }
}

applyTheme(); applyFont();
taskIn.value = D.task || "";
buildSettings();
buildClock(fmt(dur("focus")));
restoreTimer(true);
store.set(KEY, D);
initCloud();
})();
